<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>開啟分享連段 — Frame Beat Trainer (FBT)</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(15, 23, 42, 0.88);
      --border: rgba(148, 163, 184, 0.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --emerald: #10b981;
      --gold: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      font-family: 'Segoe UI', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
      background:
        linear-gradient(180deg, rgba(9, 13, 22, 0.70) 0%, rgba(9, 13, 22, 0.90) 100%),
        url('./launcher-bg.jpg') center / cover no-repeat,
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      margin-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .meta {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .combo-box {
      text-align: left;
      padding: 16px 18px;
      border-radius: 12px;
      background: rgba(9, 13, 22, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.2);
      margin-bottom: 22px;
    }

    .combo-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--cyan);
      font-weight: 700;
    }

    .combo-title {
      font-size: 18px;
      font-weight: 800;
      margin: 4px 0 8px;
    }

    .combo-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
    }

    .tag {
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
      color: #e2e8f0;
      font-weight: 700;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      color: #090d16;
      background: linear-gradient(135deg, #38bdf8 0%, #34d399 100%);
      text-decoration: none;
      margin-bottom: 14px;
      box-shadow: 0 10px 26px rgba(56, 189, 248, 0.3);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
    }

    .not-installed {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .not-installed p {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .btn-home {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      text-decoration: none;
    }

    .btn-home:hover {
      border-color: var(--cyan);
    }

    .status {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Frame Beat Trainer ・ 線上連段分享</span>
    <h1 id="heading">正在開啟 Frame Beat Trainer...</h1>
    <p class="meta" id="subtext">如果瀏覽器跳出提示，請點選「開啟 Frame Beat Trainer」以直接匯入連段。</p>

    <div class="combo-box" id="combo-box">
      <div class="combo-id" id="combo-id">載入中...</div>
      <div class="combo-title" id="combo-title">正在讀取連段資訊...</div>
      <div class="combo-tags" id="combo-tags"></div>
    </div>

    <a id="open-app-btn" class="btn-primary" href="#">在 FBT 中開啟此連段</a>
    <div class="status" id="launch-status">
      若瀏覽器上方跳出確認視窗，請點選「開啟 Frame Beat Trainer」並允許彈出視窗（可勾選一律允許）
    </div>

    <div class="not-installed" id="not-installed-box">
      <p id="not-installed-text">沒有跳出視窗？你是否還沒安裝 Frame Beat Trainer (FBT)？</p>
      <a class="btn-home" href="./index.html" id="home-btn">前往首頁一鍵下載最新版 FBT</a>
    </div>
  </main>

  <script>
    const API_BASE = 'https://fbt-combos.maxhorng92.workers.dev';
    const params = new URLSearchParams(window.location.search);
    const rawId = (params.get('id') || '').trim();
    const safeId = /^[a-zA-Z0-9_-]{3,40}$/.test(rawId) ? rawId : '';

    const heading = document.getElementById('heading');
    const subtext = document.getElementById('subtext');
    const comboIdEl = document.getElementById('combo-id');
    const comboTitleEl = document.getElementById('combo-title');
    const comboTagsEl = document.getElementById('combo-tags');
    const openBtn = document.getElementById('open-app-btn');
    const statusEl = document.getElementById('launch-status');
    const notInstalledText = document.getElementById('not-installed-text');
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    if (!safeId) {
      heading.textContent = '無效的連段分享連結';
      subtext.textContent = '請確認連結中是否包含正確的連段編號（例如 ?id=oc-xxxx）。';
      comboIdEl.textContent = 'N/A';
      comboTitleEl.textContent = '找不到連段編號';
      openBtn.style.display = 'none';
      statusEl.style.display = 'none';
    } else {
      const deepLink = `fbt://combo/${encodeURIComponent(safeId)}`;
      comboIdEl.textContent = `連段編號：${safeId}`;
      openBtn.href = deepLink;

      // Fetch combo preview from live API
      fetch(`${API_BASE}/api/combos/${encodeURIComponent(safeId)}`)
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          const item = data && (data.combo || data);
          if (!item || !item.title) {
            comboTitleEl.textContent = `連段 ${safeId}`;
            return;
          }
          comboTitleEl.textContent = item.title;
          const tags = [
            item.character ? `角色：${item.character}` : null,
            item.mode ? `模式：${item.mode}` : null,
            item.difficulty ? `難度：${item.difficulty}` : null,
            item.author_name ? `作者：${item.author_name}` : null,
          ].filter(Boolean);
          comboTagsEl.innerHTML = tags.map((t) => `<span class="tag">${t}</span>`).join('');
        })
        .catch(() => {
          comboTitleEl.textContent = `連段 ${safeId}`;
        });

      if (isMobile) {
        heading.textContent = '請使用 Windows 電腦開啟此連結';
        subtext.textContent =
          'Frame Beat Trainer (FBT) 為 Windows 電腦版工具，手機無法直接啟動。請將此連結傳到電腦開啟，或記下上方連段編號。';
        openBtn.textContent = `複製連段編號 (${safeId})`;
        openBtn.href = '#';
        openBtn.onclick = (e) => {
          e.preventDefault();
          navigator.clipboard?.writeText(safeId).catch(() => undefined);
          openBtn.textContent = `已複製編號：${safeId}`;
        };
        statusEl.textContent = '回到 Windows 電腦打開 FBT 後，到線上連段庫貼上編號即可下載！';
        notInstalledText.textContent = '電腦還沒安裝 FBT 嗎？可以先到首頁查看完整介紹：';
      } else {
        // Automatically attempt to launch FBT via custom fbt:// protocol on desktop
        setTimeout(() => {
          window.location.href = deepLink;
        }, 350);
      }
    }
  </script>
</body>
</html>
